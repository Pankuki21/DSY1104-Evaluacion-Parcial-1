<main>
  <section>
    <h1>Crea una cuenta</h1>
    <form id="form-registro">
      <input type="text" id="run" placeholder="RUN (sin puntos ni guion)" required>
      <input type="text" id="nombre" placeholder="Nombre" maxlength="50" required>
      <input type="text" id="apellidos" placeholder="Apellidos" maxlength="100" required>
      <input type="email" id="email" placeholder="Correo electrónico" maxlength="100" required>
      <input type="date" id="fechaNac">

      <select id="region" required><option value="">Seleccione Región</option></select>
      <select id="comuna" required><option value="">Seleccione Comuna</option></select>
      <textarea id="direccion" placeholder="Dirección para envíos" maxlength="300" required></textarea>
      <input type="password" id="password" placeholder="Crea tu contraseña" required>

      <button type="submit">Crear Cuenta</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="inicio-sesion.html">Inicia Sesión</a></p>
  </section>
