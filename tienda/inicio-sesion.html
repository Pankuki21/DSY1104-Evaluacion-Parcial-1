<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>URBAN STYLE - Iniciar Sesión</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 50px; background-color: #1a1a1a; color: white; }
    .card { background: #2b2b2b; padding: 25px; border-radius: 8px; width: 300px; margin: 0 auto; text-align: center; }
    input { display: block; margin-bottom: 15px; width: 90%; padding: 8px; margin-left: auto; margin-right: auto; }
    button { background: #e67e22; color: white; border: none; padding: 10px; width: 98%; font-weight: bold; cursor: pointer; }
    a { color: #e67e22; }
  </style>
</head>
<body>
  <div class="card">
    <h1>URBAN STYLE</h1>
    <p>Ingreso al Sistema</p>
    <form onsubmit="iniciarSesion(event)">
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
      <input type="password" id="loginPass" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>
    <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
  </div>

  <script>
    function iniciarSesion(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPass").value;

      const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
      const encontrado = usuarios.find(u => u.email === email && u.password === pass);

      if (encontrado) {
        localStorage.setItem("usuarioSesion", JSON.stringify(encontrado));
        if (encontrado.tipo === "Cliente") {
          alert("¡Bienvenido a URBAN STYLE!");
          window.location.href = "registro.html";
        } else {
          window.location.href = "../admin/inicio.html";
        }
      } else {
        alert("Correo o contraseña incorrectos.");
      }
    }
  </script>
</body>
</html>
